    --accent: #e8691a; --accent2: #f08040;

    --border: rgba(240,236,227,0.1); --border2: rgba(240,236,227,0.2);
    --red-bg: #2e1208; --red-text: #f5a882;

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); }

.dash-header { padding: 40px 40px 0; max-width: 1400px; margin: 0 auto; }
.dash-header h1 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 30px; margin-bottom: 4px; }
.dash-header .sub { font-size: 13px; color: var(--ink3); margin-bottom: 6px; }
.dash-header .ein { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--ink3); }

/* NAV */
.dash-nav { display: flex; gap: 0; padding: 0 40px; max-width: 1400px; margin: 24px auto 0; border-bottom: 2px solid var(--ink); overflow-x: auto; scrollbar-width: thin; }
.nav-btn { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 600; background: var(--bg3); border: 1px solid var(--border2); border-bottom: none; border-radius: 6px 6px 0 0; margin-right: 3px; color: var(--ink3); letter-spacing: .01em; flex-shrink: 0; white-space: nowrap; transition: background .15s, color .15s; }
.nav-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* SECTIONS */
.dash-section { display: none; padding: 32px 40px; max-width: 1400px; margin: 0 auto; }
.dash-section.active { display: block; }

/* CARDS */
.card-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; padding: 16px 20px; flex: 1; min-width: 160px; }
.card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin-bottom: 4px; font-weight: 600; }
.card .value { font-size: 22px; font-weight: 600; font-family: 'DM Mono', monospace; }
.card .value.red { color: var(--accent); }
.card .value.teal { color: var(--teal); }
.card .value.gold { color: var(--gold); }
.card .value.blue { color: var(--blue-text); }
.card .delta { font-size: 11px; color: var(--ink3); margin-top: 2px; font-family: 'DM Mono', monospace; }
.card .delta.up { color: var(--teal); }
.card .delta.down { color: var(--accent); }

/* CHART CONTAINERS */
.chart-wrap { background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
.chart-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin-bottom: 16px; }
.chart-subtitle { font-size: 12px; color: var(--ink3); margin-bottom: 16px; font-style: italic; }

/* BAR CHARTS */
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-group { display: flex; align-items: center; gap: 12px; }
.bar-group .bar-year { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--ink2); width: 40px; flex-shrink: 0; text-align: right; }
.bar-group .bar-tracks { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.bar-group .bar-track { height: 22px; border-radius: 3px; background: var(--bg3); overflow: hidden; position: relative; }
.bar-group .bar-fill { height: 100%; border-radius: 3px; min-width: 2px; display: flex; align-items: center; padding-left: 8px; }
.bar-group .bar-fill span { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600; white-space: nowrap; }
.bar-group .bar-vals { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink2); min-width: 90px; text-align: right; }

/* LEGEND */
.legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
.legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

/* TWO COL */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

/* THREE COL */
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
@media (max-width: 1100px) { .three-col { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) { .three-col { grid-template-columns: 1fr; } }

/* GOVERNANCE MATRIX */
.gov-matrix { width: 100%; border-collapse: collapse; font-size: 12px; }
.gov-matrix th { text-align: left; padding: 8px 10px; background: var(--ink); color: var(--bg); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; position: sticky; top: 0; }
.gov-matrix td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
.gov-matrix .yes { color: var(--teal); font-weight: 600; }
.gov-matrix .no { color: var(--accent); font-weight: 600; }
.gov-matrix .na { color: var(--ink3); font-style: italic; }

/* BOARD GRID */
.board-grid { width: 100%; border-collapse: collapse; font-size: 12px; }
.board-grid th { text-align: left; padding: 8px 10px; background: var(--ink); color: var(--bg); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; position: sticky; top: 0; }
.board-grid td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
.board-grid .role-chair { background: var(--gold-bg); color: var(--gold-text); font-weight: 600; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
.board-grid .role-vice { background: var(--blue-bg); color: var(--blue-text); font-weight: 600; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
.board-grid .role-officer { background: var(--green-bg); color: var(--green-text); font-weight: 600; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
.board-grid .role-member { background: var(--bg3); color: var(--ink3); padding: 2px 6px; border-radius: 3px; font-size: 10px; }
.board-grid .role-admin { background: var(--red-bg); color: var(--red-text); font-weight: 600; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
.board-grid .absent { color: var(--ink3); font-style: italic; }

/* FLAGS */
.flag-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
.flag-card .flag-year { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--ink3); margin-bottom: 4px; }
.flag-card .flag-text { font-size: 13px; line-height: 1.5; color: var(--ink); }

.flag-card.cat-contradiction { border-left: 3px solid var(--blue-text); }
.flag-card.cat-governance { border-left: 3px solid var(--teal); }
.flag-card.cat-identity { border-left: 3px solid var(--ink3); }

.flag-tag.financial { background: var(--red-bg); color: var(--red-text); }
.flag-tag.spelling { background: var(--gold-bg); color: var(--gold-text); }
.flag-tag.contradiction { background: var(--blue-bg); color: var(--blue-text); }
.flag-tag.governance { background: var(--green-bg); color: var(--green-text); }
.flag-tag.identity { background: var(--bg3); color: var(--ink3); }

.flow-label { width: 180px; font-size: 12px; color: var(--ink2); text-align: right; padding-right: 12px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow-bar { flex: 1; height: 24px; border-radius: 3px; background: var(--bg3); overflow: hidden; }
.flow-fill { height: 100%; border-radius: 3px; display: flex; align-items: center; padding-left: 8px; }
.flow-fill span { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600; white-space: nowrap; }
.flow-val { min-width: 90px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink2); text-align: right; padding-left: 8px; }

/* SCROLL TABLE */

/* RETAINED HIGHLIGHT */

.retained-callout .rc-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--red-text); margin-bottom: 6px; }
.retained-callout .rc-body { font-size: 13px; color: var(--ink); line-height: 1.5; }
</style>

function fmt(n) {
  if (n == null) return '—';
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtK(n) {
  if (n == null) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return '$' + Math.round(n/1e3) + 'K';
  return '$' + Math.round(n);
}
function pctChange(a, b) {
  if (!a || !b) return '';
  const pct = ((b - a) / Math.abs(a) * 100);
  const sign = pct >= 0 ? '+' : '';
  return sign + pct.toFixed(0) + '%';
}

// ─── SECTION: FINANCIAL ───
function renderFinancial() {
  const maxRev = Math.max(...DATA.map(d => d.revenue.total));
  const maxExp = Math.max(...DATA.map(d => d.expenses.total));
  const maxVal = Math.max(maxRev, maxExp);

  // Revenue vs Expenses bars
  let revExpBars = '';
  DATA.forEach(d => {
    const revPct = (d.revenue.total / maxVal * 100).toFixed(1);
    const expPct = (d.expenses.total / maxVal * 100).toFixed(1);
    const surplus = d.net_assets.revenue_less_expenses;
    const surplusClass = surplus >= 0 ? 'teal' : 'red';
    revExpBars += `
      <div class="bar-group">
        <div class="bar-year">${d.filing_year}</div>
        <div class="bar-tracks">
          <div class="bar-track"><div class="bar-fill" style="width:${revPct}%; background: var(--teal);"><span style="color:#fff;">${fmtK(d.revenue.total)}</span></div></div>
          <div class="bar-track"><div class="bar-fill" style="width:${expPct}%; background: var(--accent);"><span style="color:#fff;">${fmtK(d.expenses.total)}</span></div></div>
        </div>
        <div class="bar-vals" style="color: var(--${surplusClass}); font-weight:600;">${surplus >= 0 ? '+' : ''}${fmtK(surplus)}</div>
      </div>`;
  });

  // Net assets trajectory
  const maxNA = Math.max(...DATA.map(d => Math.max(d.net_assets.beginning, d.net_assets.end)));
  let netAssetBars = '';
  DATA.forEach(d => {
    const pct = (d.net_assets.end / maxNA * 100).toFixed(1);
    const color = d.net_assets.revenue_less_expenses >= 0 ? 'var(--teal)' : 'var(--accent)';
    netAssetBars += `
      <div class="bar-group">
        <div class="bar-year">${d.filing_year}</div>
        <div class="bar-tracks">
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background: ${color};"><span style="color:#fff;">${fmtK(d.net_assets.end)}</span></div></div>
        </div>
        <div class="bar-vals">${d.net_assets.revenue_less_expenses >= 0 ? '+' : ''}${fmtK(d.net_assets.revenue_less_expenses)}</div>
      </div>`;
  });

  // PILOT money flow — received vs distributed
  let pilotFlowHtml = '';
  const pilotData = [
    { year: 2020, received: 100048, distributed: 69549, label_dist: 'PILOT to "Summer County"' },
    { year: 2021, received: 123537, distributed: 107488, label_dist: 'Property taxes' },
    { year: 2022, received: 326731, distributed: 216413, label_dist: 'Property taxes + County School' },
    { year: 2023, received: 1758136, distributed: 1056555, label_dist: 'PILOT Distributed + County School' },
    { year: 2024, received: 2210996, distributed: 2932149, label_dist: 'PILOT Distributed + County School' },
  ];
  const maxPilot = Math.max(...pilotData.map(p => Math.max(p.received, p.distributed)));

  pilotData.forEach(p => {
    const recPct = (p.received / maxPilot * 100).toFixed(1);
    const distPct = (p.distributed / maxPilot * 100).toFixed(1);
    const retained = p.received - p.distributed;
    const retClass = retained >= 0 ? 'teal' : 'red';
    pilotFlowHtml += `
      <div class="bar-group">
        <div class="bar-year">${p.year}</div>
        <div class="bar-tracks">
          <div class="bar-track"><div class="bar-fill" style="width:${recPct}%; background: var(--blue-text);"><span style="color:#fff;">In: ${fmtK(p.received)}</span></div></div>
          <div class="bar-track"><div class="bar-fill" style="width:${distPct}%; background: var(--gold);"><span style="color:#fff;">Out: ${fmtK(p.distributed)}</span></div></div>
        </div>
        <div class="bar-vals" style="color: var(--${retClass}); font-weight:600;">${retained >= 0 ? '+' : ''}${fmtK(retained)}</div>
      </div>`;
  });

  // Expense detail by year (switchable)
  let expYearPanels = '';
  DATA.forEach((d, i) => {
    if (!d.expenses.itemization) return;
    const maxItem = Math.max(...d.expenses.itemization.map(x => x.amount || 0));
    let rows = '';
    const sorted = [...d.expenses.itemization].sort((a,b) => (b.amount||0) - (a.amount||0));
    sorted.forEach(item => {
      if (!item.amount) return;
      const pct = (item.amount / maxItem * 100).toFixed(1);
      const isLarge = item.amount > d.expenses.total * 0.3;
      rows += `
        <div class="flow-row">
          <div class="flow-label">${item.label}</div>
          <div class="flow-bar"><div class="flow-fill" style="width:${pct}%; background: ${isLarge ? 'var(--accent)' : 'var(--ink3)'};"><span style="color:#fff;">${pct > 20 ? fmtK(item.amount) : ''}</span></div></div>
          <div class="flow-val">${fmt(item.amount)}</div>
        </div>`;
    });
    expYearPanels += `<div class="exp-year-panel" data-year="${d.filing_year}" style="display:${i===DATA.length-1?'block':'none'};">${rows}</div>`;
  });

  return `
    <div class="chart-wrap">
      <div class="chart-title">Revenue vs. Expenses by Filing Year</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-swatch" style="background:var(--teal);"></div>Revenue</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--accent);"></div>Expenses</div>
      </div>
      <div class="bar-chart">${revExpBars}</div>
      <div class="chart-subtitle" style="margin-top:12px;">Net = revenue minus expenses. The IDB ran a $716K surplus in 2023 by retaining PILOT payments, then a $756K deficit in 2024 by releasing them.</div>
    </div>

    <div class="two-col">
      <div class="chart-wrap">
        <div class="chart-title">Net Assets at Year-End</div>
        <div class="bar-chart">${netAssetBars}</div>
        <div class="chart-subtitle" style="margin-top:12px;">Peak: $904K (2023). The 2024 drawdown returns the board to nearly its 2020 starting level.</div>
      </div>
      <div class="chart-wrap">
        <div class="chart-title">PILOT Money Flow: Received vs. Distributed</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-swatch" style="background:var(--blue-text);"></div>PILOT Revenue In</div>
          <div class="legend-item"><div class="legend-swatch" style="background:var(--gold);"></div>PILOT Payments Out</div>
        </div>
        <div class="bar-chart">${pilotFlowHtml}</div>
        <div class="chart-subtitle" style="margin-top:12px;">2023: retained ~$700K. 2024: distributed $80K more than received.</div>
      </div>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">Expense Breakdown by Category</div>
      <div class="year-pills" id="exp-year-pills">
        ${DATA.map((d,i) => `<div class="year-pill${i===DATA.length-1?' active':''}" onclick="switchExpYear(${d.filing_year})">${d.filing_year}</div>`).join('')}
      </div>
      <div id="exp-year-panels">${expYearPanels}</div>
      <div class="chart-subtitle">Bars sized relative to largest expense that year. Highlighted bars exceed 30% of total expenses.</div>
    </div>
  `;
}

// ─── SECTION: FLAGS ───
function categorizeFlag(text) {
  const t = text.toLowerCase();
  if (t.includes('misspel') || t.includes('misprint') || t.includes('spelled') || t.includes('misspell')) return 'spelling';
  if (t.includes('contradict') || t.includes('while schedule') || t.includes('while part') || t.includes('yet part') || t.includes('yet beginning') || t.includes('restated') || t.includes('answered no') || t.includes('answered yes')) return 'contradiction';
  if (t.includes('$') || t.includes('expense') || t.includes('revenue') || t.includes('net assets') || t.includes('distributed') || t.includes('retained') || t.includes('receipt') || t.includes('1096') || t.includes('consulting') || t.includes('management fee') || t.includes('accounting method') || t.includes('renamed')) return 'financial';
  if (t.includes('board') || t.includes('initial return') || t.includes('formation') || t.includes('whistleblower') || t.includes('document retention') || t.includes('dropped from')) return 'governance';
  if (t.includes('name') || t.includes('city of') || t.includes('county')) return 'identity';
  return 'financial';
}

function renderFlags() {
  const allFlags = [];
  DATA.forEach(d => {
    d.flags.forEach(f => {
      allFlags.push({ year: d.filing_year, text: f, cat: categorizeFlag(f) });
    });
  });

  const counts = { all: allFlags.length };
  allFlags.forEach(f => { counts[f.cat] = (counts[f.cat]||0) + 1; });

  const catLabels = {
    financial: 'Financial', spelling: 'Spelling/Typo', contradiction: 'Contradiction',
    governance: 'Governance', identity: 'Identity'
  };

  let filterHtml = `<div class="filter-chip active" data-cat="all" onclick="filterFlags('all')">All<span class="chip-count">${counts.all}</span></div>`;
  Object.keys(catLabels).forEach(cat => {
    if (counts[cat]) {
      filterHtml += `<div class="filter-chip" data-cat="${cat}" onclick="filterFlags('${cat}')">${catLabels[cat]}<span class="chip-count">${counts[cat]}</span></div>`;
    }
  });

  // Cross-year patterns
  const recurring = {};
  allFlags.forEach(f => {
    // Simplistic pattern detection — look for similar flags across years
    const key = f.text.replace(/\d{4}/g, 'YYYY').replace(/\$[\d,]+/g, '$X').substring(0, 60);
    if (!recurring[key]) recurring[key] = [];
    recurring[key].push(f.year);
  });
  const patterns = Object.entries(recurring).filter(([,yrs]) => yrs.length >= 2);

  let patternHtml = '';
  if (patterns.length) {
    patternHtml = '<div class="chart-wrap"><div class="chart-title">Recurring Patterns Across Filings</div>';
    // Specific known patterns
    const knownPatterns = [
      { label: '"Board reviews 990 after filing" vs. "Yes, board given copy before filing"', years: '2021, 2022, 2023', note: 'Three consecutive years of self-contradicting answers on the same return. In 2024, finally answered No.' },
      { label: 'Zero Forms 1096 filed', years: '2022, 2023, 2024', note: 'Despite paying legal fees, accounting fees, and (in 2024) $45K consulting + $12K management. No information returns filed for any contractor.' },
      { label: 'Mission misspellings carried forward verbatim', years: '2022, 2023, 2024', note: '"ADMINSTRATION," "PAYMNETS," and "THE COUNTY (GALLATIN)" appear identically in three consecutive filings — copy-pasted without correction.' },
      { label: '"TH ECITY" typo in Additional Data', years: '2022, 2023', note: 'Same broken space reproduced across filings.' },
      { label: 'Conflict of interest policy exists but is never monitored or enforced', years: '2021, 2022, 2023, 2024', note: 'Four consecutive years: "Yes" to having a COI policy, "No" to annual disclosure, "No" to monitoring and enforcement.' },
    ];
    knownPatterns.forEach(p => {
      patternHtml += `<div class="flag-card cat-contradiction" style="border-left-width:3px;">
        <div class="flag-year">${p.years}</div>
        <div class="flag-text" style="font-weight:600; margin-bottom:4px;">${p.label}</div>
        <div class="flag-text" style="color:var(--ink2);">${p.note}</div>
      </div>`;
    });
    patternHtml += '</div>';
  }

  let flagsHtml = '';
  allFlags.forEach(f => {
    flagsHtml += `<div class="flag-card cat-${f.cat}" data-cat="${f.cat}">
      <div class="flag-year"><span class="flag-tag ${f.cat}">${catLabels[f.cat]||f.cat}</span> ${f.year}</div>
      <div class="flag-text">${f.text}</div>
    </div>`;
  });

  return `
    ${patternHtml}
    <div class="chart-wrap">
      <div class="chart-title">All Documented Flags (${allFlags.length})</div>
      <div class="chart-subtitle">Every irregularity, error, contradiction, and anomaly found across five years of IRS filings.</div>
      <div class="filter-row" id="flag-filters">${filterHtml}</div>
      <div id="flag-list">${flagsHtml}</div>
    </div>
  `;
}

      <div class="chart-wrap">
        <div class="chart-title">Revenue Line Items</div>
        <div class="chart-subtitle">Amounts match; the audit calls the smallest line "Other income," the 990 calls it "OTHER FEES."</div>
        <div class="scroll-table">${revTableHtml}</div>
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Auditor vs. Tax Return Preparer</div>
        <div class="chart-subtitle">Two different professionals in Hendersonville. The auditor uses the board's legal name; the preparer drops "City of."</div>
        <div class="scroll-table">${auditorPreparerHtml}</div>
      </div>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">Expense Line Items — Where the Labels Diverge</div>
      <div class="chart-subtitle">Highlighted rows: same dollar amount filed under materially different category names. "Professional services" vs. "Management" and "Repair and maintenance" vs. "Occupancy" describe different economic activities.</div>
      <div class="scroll-table">${expTableHtml}</div>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">Board of Directors: Audit vs. 990</div>
      <div class="chart-subtitle">The audit lists 9 directors. The 990 lists 10 — adding Preston Stark, who signs every return, holds the books, and reports zero hours.</div>
      <div class="scroll-table">${boardHtml}</div>
    </div>

    <div class="two-col">
      <div class="retained-callout">
        <div class="rc-title">Preston Stark: Present on the 990, Absent from the Audit</div>
        <div class="rc-body">The IRS 990 lists Preston Stark as "Board Administrator" — one of 10 officers. He signs the return, is named as principal officer, and the books are in his care. The CPA's audited Board of Directors page lists 9 people. Preston Stark is not among them. Two documents covering the same fiscal year, prepared within 11 days of each other, disagree on whether the person who runs the board is part of the board.</div>
      </div>
      ${cdHtml}
    </div>

    <div class="two-col">
      <div class="discovery">
        <div class="disc-title">Discovery: The Auditor's Own Typo</div>
        <div class="disc-body">Pages 4, 5, 6, and 10 of the CPA's audit report all read: "The accompanying notes are an <strong>intergal</strong> part of these statements." The word is "integral." This boilerplate language appears on every major financial statement in the report — the auditor's own template has a misspelling that went unnoticed across four pages. In a filing ecosystem where the entity itself misspells its own name on the 990, even the independent check has errors.</div>
      </div>
      <div class="discovery">
        <div class="disc-title">Discovery: No Prior Year Comments — From Whom?</div>
        <div class="disc-body">The audit's final page states: "There were no prior year comments." The 990 for both 2022 and 2023 answered "Yes" to financial statements being audited — so prior audits existed. Either those prior auditors also found nothing noteworthy (despite every irregularity this dashboard catalogs), or this is the first time <em>this particular auditor</em> examined the board's books, inheriting no prior comment trail. The report does not clarify.</div>
      </div>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">Internal Control & Compliance</div>
      <div class="chart-subtitle">What the auditor tested — and what he explicitly declined to opine on.</div>
      <div class="scroll-table">
        <table class="gov-matrix">
          <thead><tr><th>Area</th><th>Auditor's Position</th><th>990 Self-Reported</th></tr></thead>
          <tbody>
            <tr><td style="font-weight:600;">Financial Statement Opinion</td><td class="yes">Unmodified — presents fairly</td><td>N/A (990 is self-reported)</td></tr>
            <tr><td style="font-weight:600;">Internal Control Effectiveness</td><td class="na">Opinion expressly disclaimed</td><td class="no">No whistleblower policy, no doc retention, COI not monitored</td></tr>
            <tr><td style="font-weight:600;">Material Weaknesses Found</td><td class="yes">None identified</td><td class="na">Not self-assessed</td></tr>
            <tr><td style="font-weight:600;">Significant Deficiencies Found</td><td class="yes">None identified</td><td class="na">Not self-assessed</td></tr>
            <tr><td style="font-weight:600;">Noncompliance Instances</td><td class="yes">None identified</td><td class="na">Not self-assessed</td></tr>
            <tr><td style="font-weight:600;">990 Reviewed by Board Before Filing</td><td class="na">Not addressed</td><td class="no">No (first year answering honestly)</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

const SECTIONS = [
  { id: 'overview', label: 'Overview', render: renderOverview },
  { id: 'auditrecon', label: 'Audit vs. 990', render: renderAuditRecon },
  { id: 'financial', label: 'Financial', render: renderFinancial },
  { id: 'governance', label: 'Governance & Board', render: renderGovernance },
  { id: 'flags', label: 'Flags & Findings', render: renderFlags },
  { id: 'identity', label: 'Identity & Filing', render: renderIdentity },
  { id: 'rawdata', label: 'Raw Data', render: renderRawData },
];

function buildNav() {
  const nav = document.getElementById('dash-nav');
  nav.innerHTML = SECTIONS.map((s, i) =>
    `<div class="nav-btn${i===0?' active':''}" onclick="showSection('${s.id}')">${s.label}</div>`
  ).join('');
}

function buildContent() {
  const container = document.getElementById('dash-content');
  container.innerHTML = SECTIONS.map((s, i) =>
    `<div id="section-${s.id}" class="dash-section${i===0?' active':''}">${s.render()}</div>`
  ).join('');
}

function showSection(id) {
  document.querySelectorAll('.dash-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  event.target.classList.add('active');
}

function switchExpYear(year) {
  document.querySelectorAll('.exp-year-panel').forEach(p => p.style.display = 'none');
  document.querySelector(`.exp-year-panel[data-year="${year}"]`).style.display = 'block';
  document.querySelectorAll('#exp-year-pills .year-pill').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
}

function switchRawYear(year) {
  document.querySelectorAll('.raw-year-panel').forEach(p => p.style.display = 'none');
  document.querySelector(`.raw-year-panel[data-year="${year}"]`).style.display = 'block';
  document.querySelectorAll('#raw-year-pills .year-pill').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
}

function filterFlags(cat) {
  document.querySelectorAll('#flag-list .flag-card').forEach(card => {
    card.style.display = (cat === 'all' || card.dataset.cat === cat) ? 'block' : 'none';
  });
  document.querySelectorAll('#flag-filters .filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === cat);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  buildNav();
  buildContent();
});
</script>
</body>
</html>
